name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build TouchpadGood Suite
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build.ps1

      - name: Create GitHub Release with version-specific changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $changelog = Get-Content -Raw -Encoding UTF8 "docs/CHANGELOG.md"
          $pattern = "(?ms)^##\s+" + [regex]::Escape($tag) + "\r?\n(.*?)(?=^##\s+v|\z)"
          $m = [regex]::Match($changelog, $pattern)

          if ($m.Success) {
            $body = $m.Groups[1].Value.Trim().TrimEnd('-').Trim()
          } else {
            $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
            if ($prevTag) {
              $commits = (git log "$prevTag..$tag" --pretty=format:"- %s (%h)") -join "`n"
            } else {
              $commits = (git log -n 10 --pretty=format:"- %s (%h)") -join "`n"
            }
            $body = "### Changes`n$commits"
          }

          $notes = @"
          $body

          ---
          ### Download
          - **`TouchpadGoodSetup.exe`** — All-in-One Installer / Updater / Uninstaller (Recommended)
          - **`TouchpadGood.exe`** — Standalone headless background driver
          - **`TouchpadGoodSettings.exe`** — Standalone Fluent Design Settings UI
          "@

          $notesFile = Join-Path $env:RUNNER_TEMP "release_notes.md"
          [System.IO.File]::WriteAllText($notesFile, $notes, (New-Object System.Text.UTF8Encoding($false)))

          gh release delete $tag --yes 2>$null
          gh release create $tag `
            TouchpadGoodSetup.exe `
            TouchpadGood.exe `
            TouchpadGoodSettings.exe `
            --title "TouchpadGood $tag" `
            --notes-file $notesFile
